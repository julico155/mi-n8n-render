version: '1'

services:
  - type: web
    name: n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-mxnd.onrender.com
      - key: WEBHOOK_URL
        value: https://n8n-mxnd.onrender.com

      # Configuración ligera
      - key: EXECUTIONS_MODE
        value: regular
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: N8N_RUNNERS_ENABLED
        value: false
      - key: N8N_NATIVE_PYTHON_RUNNER
        value: false
      - key: EXECUTIONS_DATA_PRUNE
        value: true
      - key: EXECUTIONS_DATA_MAX_AGE
        value: 72
      - key: TZ
        value: America/La_Paz

    healthCheckPath: /
    autoDeploy: true
